<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tlBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="tlRing" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tlBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" stroke="url(#tlRing)" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Earth Globe & Latitude/Longitude Grid -->
  <circle cx="32" cy="32" r="18" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.6"/>
  <ellipse cx="32" cy="32" rx="9" ry="18" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.4"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.4"/>
  <!-- Orbital Satellite Scanning Arc -->
  <path d="M10 42 C 20 18, 44 14, 54 24" stroke="url(#tlRing)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Trend & Breakpoint Signal Waveform -->
  <polyline points="14,39 22,35 28,38 35,26 42,29 50,19" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Anomaly Detection Node -->
  <circle cx="35" cy="26" r="3.6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="50" cy="19" r="3.2" fill="#10b981" stroke="#ffffff" stroke-width="1.4"/>
</svg>
