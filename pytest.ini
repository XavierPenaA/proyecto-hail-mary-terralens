[pytest]
testpaths = tests
filterwarnings =
    # Python 3.14 deprecations raised inside FastAPI/Starlette, not in TerraLens code.
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::PendingDeprecationWarning:starlette.*
    # Starlette's GZip middleware on Python 3.14 closes its buffer twice under TestClient (upstream issue).
    ignore:Exception ignored while finalizing file <gzip:pytest.PytestUnraisableExceptionWarning
